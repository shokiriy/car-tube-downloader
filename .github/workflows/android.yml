name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew test assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Confirm Android 8.1 install floor
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk | grep -F "sdkVersion:'27'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-arm64-v8a-debug.apk | grep -F "sdkVersion:'27'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartube-debug-apks-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**
  android-8-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 8.1 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          target: default
          sdcard-path-or-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell df -h /storage/emulated/0
            ./gradlew assembleDebug -PciEmulator=true
            adb install -r -g app/build/outputs/apk/debug/app-x86-debug.apk
            ./gradlew connectedDebugAndroidTest -PciEmulator=true --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartube-android-8-emulator-results
          path: app/build/outputs/androidTest-results/**
