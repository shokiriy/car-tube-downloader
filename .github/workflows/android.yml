name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew test assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartube-debug-apks-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**
